name = "workout-tracker"
main = "src/worker.js"
compatibility_date = "2026-07-31"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "workout-tracker"
database_id = "replace-with-production-d1-id"
migrations_dir = "migrations"

[vars]
ATHLETE_A_EMAIL = "athlete-a@example.invalid"
ATHLETE_B_EMAIL = "athlete-b@example.invalid"
DEFAULT_TIMEZONE = "Asia/Shanghai"
ACCESS_ISSUER = "https://replace-with-access-team.cloudflareaccess.com"
ACCESS_AUDIENCE = "replace-with-access-application-audience"
PRODUCTION_HOST = "workout.lagrangee.xyz"
