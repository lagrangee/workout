<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workout 有氧 tab · Prototype</title>
    <style>
      :root {
        --accent: #d65d3f;
        --accent-dark: #a8432c;
        --green: #477a5d;
        --ink: #26231f;
        --muted: #787168;
        --paper: #f6f1e8;
        --card: #fffdf8;
        --line: #e6ddd0;
        --soft-green: #e8f0e8;
        --soft-accent: #fbf0eb;
        --soft-blue: #edf3f9;
        --shadow: 0 18px 45px rgba(74, 52, 30, 0.08);
        --radius-card: 18px;
        --radius-control: 12px;
        --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
      }
      button { font: inherit; }
      button:focus-visible { outline: 3px solid rgba(214, 93, 63, .35); outline-offset: 2px; }
      .prototype-shell { max-width: 1040px; min-height: 100vh; margin: 0 auto; padding: 18px 22px 112px; }
      .prototype-mark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .04em;
      }
      .prototype-mark::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
      .eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 800; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font-size: clamp(30px, 7vw, 44px); line-height: 1.05; letter-spacing: -.035em; }
      h2 { margin-bottom: 0; font-size: 22px; line-height: 1.2; }
      h3 { margin-bottom: 4px; font-size: 16px; line-height: 1.25; }
      .muted { color: var(--muted); }
      .page-subtitle { max-width: 42ch; margin-bottom: 0; color: var(--muted); font-size: 14px; }
      .tabbar {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 253, 248, .72);
      }
      .tab {
        min-height: 42px;
        padding: 8px 14px;
        border: 0;
        border-radius: 10px;
        color: var(--muted);
        background: transparent;
        font-size: 13px;
        font-weight: 800;
        cursor: default;
      }
      .tab.active { color: var(--ink); background: var(--card); box-shadow: 0 3px 9px rgba(38, 35, 31, .08); }
      .section { margin-top: 22px; }
      .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
      .section-head p { margin-bottom: 0; font-size: 13px; }
      .panel { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--card); box-shadow: var(--shadow); }
      .panel.flat { box-shadow: none; }
      .meta { color: var(--muted); font-size: 12px; }
      .status { display: inline-flex; align-items: center; min-height: 28px; padding: 6px 9px; border-radius: 999px; color: var(--green); background: var(--soft-green); font-size: 12px; font-weight: 800; white-space: nowrap; }
      .status.neutral { color: #765922; background: #fff5e2; }
      .status.sync { color: #4e6885; background: var(--soft-blue); }
      .split-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 800; }
      .split-label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
      .split-label.aerobic::before { background: #6687a8; }
      .row-list { display: grid; gap: 10px; }
      .activity-row, .route-row, .history-row, .day-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-width: 0;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .activity-row:last-child, .route-row:last-child, .history-row:last-child, .day-row:last-child { border-bottom: 0; padding-bottom: 0; }
      .activity-row:first-child, .route-row:first-child, .history-row:first-child, .day-row:first-child { padding-top: 0; }
      .row-main { min-width: 0; }
      .row-main strong, .row-main small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row-main strong { font-size: 15px; }
      .row-main small { margin-top: 3px; color: var(--muted); font-size: 12px; }
      .row-value { flex: 0 0 auto; text-align: right; }
      .row-value strong, .row-value small { display: block; }
      .row-value strong { font-variant-numeric: tabular-nums; font-size: 14px; }
      .row-value small { margin-top: 3px; color: var(--muted); font-size: 11px; }
      .date-control { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      .date-control button, .route-select, .quiet-action {
        min-height: 40px;
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        color: var(--ink);
        background: var(--card);
        font-size: 12px;
        font-weight: 800;
      }
      .date-control button { min-width: 40px; font-size: 18px; line-height: 1; }
      .date-control strong { font-size: 14px; }
      .notice { margin-top: 12px; padding: 10px 12px; border-radius: 12px; color: #765922; background: #fff5e2; font-size: 12px; }
      .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
      .metric { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fbf7f0; }
      .metric strong, .metric small { display: block; }
      .metric strong { font-size: 21px; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .metric small { margin-top: 5px; color: var(--muted); font-size: 11px; }
      .route-button { width: 100%; border: 0; padding: 0; color: inherit; background: transparent; text-align: left; cursor: pointer; }
      .route-row.is-selected { margin: 0 -10px; padding: 13px 10px; border-radius: 12px; background: var(--soft-accent); }
      .route-row.is-selected:first-child { padding-top: 13px; }
      .route-row.is-selected:last-child { padding-bottom: 13px; }
      .route-name { display: flex; align-items: center; gap: 8px; }
      .route-name::before { content: ""; width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: #6687a8; }
      .route-direction { color: var(--muted); font-size: 11px; }
      .route-detail-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
      .route-detail-head p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
      .history-chart { display: flex; align-items: end; gap: 8px; height: 90px; margin: 18px 0 12px; padding: 0 3px; border-bottom: 1px solid var(--line); }
      .history-bar { display: flex; flex: 1; flex-direction: column; justify-content: end; align-items: center; gap: 5px; min-width: 0; height: 100%; }
      .history-bar i { display: block; width: min(32px, 100%); min-height: 8px; border-radius: 7px 7px 0 0; background: #9fb5c9; }
      .history-bar:nth-child(2n) i { background: #6687a8; }
      .history-bar small { color: var(--muted); font-size: 10px; }
      .grid-two { display: grid; gap: 18px; }
      .callout { display: flex; align-items: start; gap: 10px; padding: 13px 14px; border-radius: 14px; background: var(--soft-blue); color: #4e6885; }
      .callout strong, .callout span { display: block; }
      .callout strong { font-size: 13px; }
      .callout span { margin-top: 2px; font-size: 12px; }
      .route-pills { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
      .route-pills::-webkit-scrollbar { display: none; }
      .route-pill { flex: 0 0 auto; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--card); font-size: 12px; font-weight: 800; cursor: pointer; }
      .route-pill.active { border-color: var(--accent); color: var(--accent-dark); background: var(--soft-accent); }
      .route-index { display: grid; gap: 8px; }
      .route-index .route-row { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
      .route-index .route-row:first-child, .route-index .route-row:last-child { padding: 12px; }
      .route-index .route-row.is-selected { border-color: var(--accent); }
      .history-row .history-date { flex: 0 0 78px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .history-row .history-stats { flex: 1; min-width: 0; }
      .history-row .history-stats strong, .history-row .history-stats small { display: block; }
      .history-row .history-stats small { margin-top: 3px; color: var(--muted); font-size: 11px; }
      .tab-explain { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
      .prototype-switcher { position: fixed; z-index: 10; left: 50%; bottom: 18px; display: flex; align-items: center; gap: 6px; min-width: min(340px, calc(100vw - 28px)); transform: translateX(-50%); padding: 6px; border: 1px solid #3d3630; border-radius: 999px; color: #fffdf8; background: #3d3630; box-shadow: 0 8px 20px rgba(38, 35, 31, .18); }
      .prototype-switcher button { width: 36px; height: 36px; border: 0; border-radius: 50%; color: #fffdf8; background: transparent; font-size: 22px; cursor: pointer; }
      .prototype-switcher button:hover { background: rgba(255, 255, 255, .12); }
      .prototype-switcher span { flex: 1; text-align: center; font-size: 12px; font-weight: 800; }
      .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 26px; padding: 8px; border-top: 1px solid var(--line); color: var(--muted); }
      .bottom-nav span { padding: 8px 4px; text-align: center; font-size: 11px; }
      .bottom-nav span.active { color: var(--accent-dark); font-weight: 800; }
      @media (min-width: 720px) {
        .prototype-shell { padding-top: 28px; }
        .grid-two { grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); align-items: start; }
        .route-first { grid-template-columns: 260px minmax(0, 1fr); }
        .bottom-nav { max-width: 420px; margin-left: auto; margin-right: auto; }
      }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <main id="prototype" class="prototype-shell"></main>
    <div class="prototype-switcher" aria-label="Prototype variant switcher">
      <button id="previous" aria-label="上一个方案">‹</button>
      <span id="variant-label"></span>
      <button id="next" aria-label="下一个方案">›</button>
    </div>
    <script>
      const routes = [
        { key: "xiangshan", name: "香山鸡腿", sport: "徒步", count: 12, distance: "84.3 km", last: "2026-08-16", history: [
          ["08-16", "8.4 km", "1:42", "132 bpm", "forward"],
          ["08-09", "7.9 km", "1:36", "128 bpm", "reverse"],
          ["07-27", "8.1 km", "1:39", "130 bpm", "forward"],
          ["07-13", "8.0 km", "1:41", "126 bpm", "reverse"]
        ] },
        { key: "olympic", name: "奥森环线", sport: "跑步", count: 8, distance: "62.8 km", last: "2026-08-12", history: [
          ["08-12", "7.8 km", "46:18", "148 bpm", "forward"],
          ["08-03", "7.8 km", "47:06", "145 bpm", "forward"],
          ["07-25", "7.7 km", "48:11", "142 bpm", "reverse"]
        ] },
        { key: "canal", name: "通惠河慢跑", sport: "跑步", count: 5, distance: "31.5 km", last: "2026-08-05", history: [
          ["08-05", "6.2 km", "39:25", "139 bpm", "forward"],
          ["07-19", "6.3 km", "40:03", "136 bpm", "forward"]
        ] }
      ];
      const activities = [
        { date: "2026-08-16", route: "香山鸡腿", sport: "徒步", distance: "8.4 km", duration: "1:42", metric: "132 bpm", direction: "forward", status: "已同步" },
        { date: "2026-08-12", route: "奥森环线", sport: "跑步", distance: "7.8 km", duration: "46:18", metric: "148 bpm", direction: "forward", status: "已同步" },
        { date: "2026-08-09", route: "香山鸡腿", sport: "徒步", distance: "7.9 km", duration: "1:36", metric: "128 bpm", direction: "reverse", status: "已同步" }
      ];
      const variants = [
        { key: "A", name: "日期合流" },
        { key: "B", name: "活动与路线" },
        { key: "C", name: "路线历史" }
      ];
      let selectedRoute = "xiangshan";
      const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
      const selected = () => routes.find((route) => route.key === selectedRoute) || routes[0];
      const routeRows = (compact = false) => routes.map((route) => `<div class="route-row ${route.key === selectedRoute ? "is-selected" : ""}"><button class="route-button" data-route="${route.key}"><div class="row-main"><strong class="route-name">${esc(route.name)}</strong><small>${esc(route.sport)} · ${route.count} 次 · ${route.distance}</small></div><div class="row-value"><strong>${route.last.slice(5)}</strong><small>最近一次</small></div></button></div>`).join("");
      const activityRows = (items = activities) => items.map((activity) => `<div class="activity-row"><div class="row-main"><strong>${esc(activity.route)}</strong><small>${activity.date} · ${activity.sport} · ${activity.direction === "reverse" ? "反向" : "正向"}</small></div><div class="row-value"><strong>${activity.distance} · ${activity.duration}</strong><small>${activity.metric} · ${activity.status}</small></div></div>`).join("");
      const historyRows = (route = selected()) => route.history.map(([date, distance, duration, metric, direction]) => `<div class="history-row"><span class="history-date">2026-${date}</span><div class="history-stats"><strong>${distance} · ${duration}</strong><small>${metric} · ${direction === "reverse" ? "反向" : "正向"}</small></div><span class="status sync">已同步</span></div>`).join("");
      const routePills = () => routes.map((route) => `<button class="route-pill ${route.key === selectedRoute ? "active" : ""}" data-route="${route.key}">${esc(route.name)}</button>`).join("");
      const shell = (content) => `<div class="prototype-mark">PROTOTYPE · 不进入正式应用</div><header class="page-head"><div><p class="eyebrow">WORKOUT TRACKER</p><h1>训练</h1><p class="page-subtitle">有氧记录与力量训练并列展示；两者仍保持独立来源。</p></div><div class="tabbar" aria-label="页面 tab"><button class="tab">力量</button><button class="tab active">有氧</button></div></header>${content}<nav class="bottom-nav" aria-label="主导航"><span>今日</span><span>日历</span><span class="active">进展</span><span>设置</span></nav>`;
      const variantA = () => shell(`<p class="tab-explain">方案 A · 以日期为主入口，适合先问“这一天发生了什么”。</p><section class="panel"><div class="date-control"><button aria-label="前一天">‹</button><strong>2026 年 8 月 16 日 · 周日</strong><button aria-label="后一天">›</button></div><div class="row-list"><div class="day-row"><div class="row-main"><span class="split-label">力量训练</span><strong>上肢基础</strong><small>Workout Session · 已完成 · 42 分钟</small></div><span class="status">已完成</span></div><div class="day-row"><div class="row-main"><span class="split-label aerobic">有氧活动</span><strong>香山鸡腿</strong><small>徒步 · 8.4 km · 1 小时 42 分 · 132 bpm</small></div><span class="status sync">已同步</span></div></div><div class="notice">同日上下文，不代表同一次训练，也不会自动建立 Workout ↔ COROS 关系。</div></section><section class="section"><div class="section-head"><h2>路线历史入口</h2><p class="muted">3 条路线 · 25 次</p></div><div class="panel flat"><div class="row-list">${routeRows()}</div></div></section><section class="section"><div class="section-head"><h2>最近有氧</h2><p class="muted">按活动时间</p></div><div class="panel flat"><div class="row-list">${activityRows()}</div></div></section>`);
      const variantB = () => shell(`<p class="tab-explain">方案 B · 活动和路线是两个并列入口，适合既看最近训练又看固定路线。</p><section class="panel"><div class="section-head"><div><h2>有氧总览</h2><p class="meta">过去 30 天 · 数据截至 2026-08-16</p></div><span class="status sync">同步完整</span></div><div class="metrics"><div class="metric"><strong>6</strong><small>活动次数</small></div><div class="metric"><strong>42.6</strong><small>公里</small></div><div class="metric"><strong>4</strong><small>活跃路线</small></div></div></section><section class="section grid-two"><section class="panel flat"><div class="section-head"><h2>活动</h2><p class="muted">最近优先</p></div><div class="row-list">${activityRows()}</div></section><section class="panel flat"><div class="section-head"><h2>路线</h2><p class="muted">按最近使用</p></div><div class="row-list">${routeRows()}</div></section></section><section class="section panel"><div class="route-detail-head"><div><p class="eyebrow">选中路线</p><h2>${esc(selected().name)}</h2><p>${esc(selected().sport)} · ${selected().count} 次历史活动 · ${selected().distance}</p></div><span class="status">路线已识别</span></div><div class="history-chart">${selected().history.map((item) => `<div class="history-bar"><i style="height:${35 + Math.min(50, item[1].length * 3)}%"></i><small>${item[0]}</small></div>`).join("")}</div><div class="row-list">${historyRows()}</div></section>`);
      const variantC = () => shell(`<p class="tab-explain">方案 C · 路线是主导航，直接回答“这条路线最近怎么走、历史趋势怎样”。</p><section class="panel flat"><div class="section-head"><div><p class="eyebrow">路线选择</p><h2>我的路线</h2></div><span class="meta">${routes.length} 条</span></div><div class="route-pills">${routePills()}</div></section><section class="section grid-two route-first"><section class="panel flat"><div class="section-head"><h2>路线索引</h2><p class="muted">历史次数</p></div><div class="route-index">${routeRows()}</div></section><section class="panel"><div class="route-detail-head"><div><p class="eyebrow">${esc(selected().sport)} · ${selected().count} 次</p><h2>${esc(selected().name)}</h2><p>累计 ${selected().distance} · 最近 ${selected().last}</p></div><span class="status sync">已同步</span></div><div class="metrics"><div class="metric"><strong>${selected().history[0][1]}</strong><small>最近距离</small></div><div class="metric"><strong>${selected().history[0][2]}</strong><small>最近用时</small></div><div class="metric"><strong>${selected().history[0][3].split(" ")[0]}</strong><small>平均心率</small></div></div><div class="section-head section"><h2>历史记录</h2><p class="muted">正向 / 反向均保留</p></div><div class="row-list">${historyRows()}</div><div class="callout section"><div><strong>当天力量训练</strong><span>独立显示在日期上下文中，不合并到路线历史。</span></div></div></section></section>`);
      function currentVariant() { const key = new URLSearchParams(location.search).get("variant") || "A"; return variants.some((variant) => variant.key === key) ? key : "A"; }
      function setVariant(key) { const url = new URL(location.href); url.searchParams.set("variant", key); history.replaceState({}, "", url); render(); }
      function render() {
        const key = currentVariant();
        document.querySelector("#prototype").innerHTML = key === "A" ? variantA() : key === "B" ? variantB() : variantC();
        document.querySelector("#variant-label").textContent = `${key} · ${variants.find((variant) => variant.key === key).name}`;
        document.querySelectorAll("[data-route]").forEach((element) => element.addEventListener("click", () => { selectedRoute = element.dataset.route; render(); }));
      }
      function cycle(delta) { const current = variants.findIndex((variant) => variant.key === currentVariant()); setVariant(variants[(current + delta + variants.length) % variants.length].key); }
      document.querySelector("#previous").addEventListener("click", () => cycle(-1));
      document.querySelector("#next").addEventListener("click", () => cycle(1));
      document.addEventListener("keydown", (event) => { if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return; if (event.key === "ArrowLeft") cycle(-1); if (event.key === "ArrowRight") cycle(1); });
      render();
    </script>
  </body>
</html>
