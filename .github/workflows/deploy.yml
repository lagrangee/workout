name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://workout.lagrangee.xyz
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks before deploy
        run: npm run release-check

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Publish deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Cloudflare deployment"
            echo "- Worker: workout-tracker"
            echo "- Custom domain: https://workout.lagrangee.xyz"
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "- Wrangler deployment URL: $DEPLOYMENT_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production hostname
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://workout.lagrangee.xyz/healthz)"
          echo "$response" | grep -F '"ok":true' >/dev/null
          echo "- Health check: https://workout.lagrangee.xyz/healthz" >> "$GITHUB_STEP_SUMMARY"
