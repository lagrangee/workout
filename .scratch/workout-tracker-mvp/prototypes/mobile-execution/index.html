<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>训练执行体验原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-stage">
      <section class="phone-shell" aria-label="Workout Tracker 训练执行原型">
        <div id="app"></div>
      </section>
    </main>

    <nav class="prototype-switcher" aria-label="原型方案切换">
      <button type="button" data-switch="prev" aria-label="上一个方案">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <div class="prototype-label">
        <strong id="variant-label">B — 专注模式</strong>
        <span>Throwaway prototype</span>
      </div>
      <button type="button" data-switch="next" aria-label="下一个方案">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
      <div class="prototype-samples">
        <button type="button" data-sample="active">进行中示例</button>
        <button type="button" data-sample="summary">结束示例</button>
        <button type="button" data-sample="skipped">已跳过示例</button>
      </div>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
