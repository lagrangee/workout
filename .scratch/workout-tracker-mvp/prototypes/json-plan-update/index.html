<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>计划更新体验原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-stage">
      <section class="phone-shell" aria-label="Workout Tracker 计划更新原型">
        <div id="app"></div>
      </section>
    </main>

    <nav class="prototype-switcher" aria-label="原型方案切换">
      <button type="button" data-switch="prev" aria-label="上一个方案">←</button>
      <div>
        <strong id="variant-label">A — 同页渐进</strong>
        <span>Throwaway prototype</span>
      </div>
      <button type="button" data-switch="next" aria-label="下一个方案">→</button>
      <div class="prototype-samples">
        <button type="button" data-sample="valid">填入有效示例</button>
        <button type="button" data-sample="invalid">填入错误示例</button>
      </div>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
